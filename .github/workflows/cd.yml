name: CD - train, push image, deploy to SageMaker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC -> AWS, no static keys
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production   # add required reviewers in repo settings for a manual approval gate
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      ENDPOINT: ${{ vars.SAGEMAKER_ENDPOINT_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - run: pip install -r requirements-train.txt

      - name: Train full model (fails the pipeline if quality gate R2 < 0.6)
        run: python -m src.train --min-r2 0.6

      - name: Package model.tar.gz
        run: python deploy/sagemaker/package_model.py
      
      - name: Debug OIDC token claims (temporary — remove after fixing)
        run: |
          IDTOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$IDTOKEN" | cut -d '.' -f2)
          MOD=$(( ${#PAYLOAD} % 4 ))
          [ $MOD -eq 2 ] && PAYLOAD="${PAYLOAD}=="
          [ $MOD -eq 3 ] && PAYLOAD="${PAYLOAD}="
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d | jq '{sub, aud, repository, ref, environment}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}"
          docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          echo "IMAGE_URI=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Upload model artifact (versioned by commit)
        run: |
          aws s3 cp build/model.tar.gz "s3://${S3_BUCKET}/models/${GITHUB_SHA}/model.tar.gz"
          echo "MODEL_DATA=s3://${S3_BUCKET}/models/${GITHUB_SHA}/model.tar.gz" >> "$GITHUB_ENV"

      - name: Deploy / update SageMaker endpoint
        run: |
          python deploy/sagemaker/deploy.py \
            --endpoint-name "$ENDPOINT" --image-uri "$IMAGE_URI" --model-data "$MODEL_DATA" \
            --role-arn "${{ secrets.SAGEMAKER_ROLE_ARN }}" --region "$AWS_REGION" --mode serverless

      - name: Smoke test live endpoint
        run: python deploy/sagemaker/invoke.py --endpoint-name "$ENDPOINT" --region "$AWS_REGION"
